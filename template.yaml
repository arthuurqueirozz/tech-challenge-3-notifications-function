AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: FCG Fase 4 - notificacoes SQS, Lambda, DynamoDB e CloudWatch; producer identities belong to orchestration
Parameters:
  ProjectName:
    Type: String
    Default: fcg-fase4
    MinLength: 3
    MaxLength: 28
    AllowedPattern: '^[a-z][a-z0-9-]*$'
    Description: Prefixo exclusivo para uma instalacao por conta/regiao; nao reutilizar a stack historica F3.
  NotificationsEnabled:
    Type: String
    Default: 'false'
    AllowedValues: ['true', 'false']
    Description: Habilitar somente durante testes e demonstracao para limitar polling ocioso.
Conditions:
  ProcessNotifications: !Equals [!Ref NotificationsEnabled, 'true']
Resources:
  UserCreatedQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub '${ProjectName}-user-created'
      VisibilityTimeout: 180
      MessageRetentionPeriod: 345600
      ReceiveMessageWaitTimeSeconds: 20
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
  PaymentProcessedQueue:
    Type: AWS::SQS::Queue
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      QueueName: !Sub '${ProjectName}-payment-processed'
      VisibilityTimeout: 180
      MessageRetentionPeriod: 345600
      ReceiveMessageWaitTimeSeconds: 20
      SqsManagedSseEnabled: true
      Tags:
        - Key: Project
          Value: !Ref ProjectName
  EventsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${ProjectName}-notification-events'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: EventKey
          AttributeType: S
      KeySchema:
        - AttributeName: EventKey
          KeyType: HASH
      Tags:
        - Key: Project
          Value: !Ref ProjectName
  NotificationLogs:
    Type: AWS::Logs::LogGroup
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      LogGroupName: !Sub '/aws/lambda/${ProjectName}-notifications'
      RetentionInDays: 7
      Tags:
        - Key: Project
          Value: !Ref ProjectName
  NotificationRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${ProjectName}-notifications-role'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: !Sub '${ProjectName}-notification-runtime'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: [sqs:ReceiveMessage, sqs:DeleteMessage, sqs:GetQueueAttributes]
                Resource: [!GetAtt UserCreatedQueue.Arn, !GetAtt PaymentProcessedQueue.Arn]
              - Effect: Allow
                Action: [dynamodb:PutItem, dynamodb:GetItem]
                Resource: !GetAtt EventsTable.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !GetAtt NotificationLogs.Arn
      Tags:
        - Key: Project
          Value: !Ref ProjectName
  NotificationsFunction:
    Type: AWS::Serverless::Function
    DependsOn: NotificationLogs
    Properties:
      FunctionName: !Sub '${ProjectName}-notifications'
      CodeUri: src/FCG.Notifications.Function/
      Handler: FCG.Notifications.Function::FCG.Notifications.Function.Function::FunctionHandler
      Runtime: dotnet10
      Architectures: [x86_64]
      MemorySize: 256
      Timeout: 30
      Role: !GetAtt NotificationRole.Arn
      Environment:
        Variables:
          EVENTS_TABLE: !Ref EventsTable
          USER_CREATED_QUEUE_ARN: !GetAtt UserCreatedQueue.Arn
          PAYMENT_PROCESSED_QUEUE_ARN: !GetAtt PaymentProcessedQueue.Arn
      Events:
        UserCreated:
          Type: SQS
          Properties:
            Enabled: !If [ProcessNotifications, true, false]
            Queue: !GetAtt UserCreatedQueue.Arn
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig:
              MaximumConcurrency: 2
        PaymentProcessed:
          Type: SQS
          Properties:
            Enabled: !If [ProcessNotifications, true, false]
            Queue: !GetAtt PaymentProcessedQueue.Arn
            BatchSize: 10
            FunctionResponseTypes: [ReportBatchItemFailures]
            ScalingConfig:
              MaximumConcurrency: 2
      Tags:
        Project: !Ref ProjectName
Outputs:
  FunctionName:
    Value: !Ref NotificationsFunction
  FunctionArn:
    Value: !GetAtt NotificationsFunction.Arn
  UserCreatedQueueArn:
    Value: !GetAtt UserCreatedQueue.Arn
  UserCreatedQueueUrl:
    Value: !Ref UserCreatedQueue
  PaymentProcessedQueueUrl:
    Value: !Ref PaymentProcessedQueue
  PaymentProcessedQueueArn:
    Value: !GetAtt PaymentProcessedQueue.Arn
  EventsTableName:
    Value: !Ref EventsTable
  EventsTableArn:
    Value: !GetAtt EventsTable.Arn
  LogGroupName:
    Value: !Ref NotificationLogs
  LogGroupArn:
    Value: !GetAtt NotificationLogs.Arn
  NotificationsRoleArn:
    Value: !GetAtt NotificationRole.Arn
